# Secure Evolution Manager reverse proxy.
# Current VPS deployment uses Evolution API's built-in Manager at 127.0.0.1:8080/manager/.
# If a standalone Manager is later re-enabled on port 8081, change the upstream port below to 8081.

upstream evolution_manager_backend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    server_name whatsapp.nijahomzs.com manager.nijahomzs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name whatsapp.nijahomzs.com manager.nijahomzs.com;

    ssl_certificate /etc/letsencrypt/live/whatsapp.nijahomzs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatsapp.nijahomzs.com/privkey.pem;

    client_max_body_size 20m;

    # Strongly recommended before sharing with a client:
    # sudo apt-get install apache2-utils
    # sudo htpasswd -c /etc/nginx/.htpasswd-nijahomzs-manager client
    auth_basic "Nijahomzs WhatsApp Manager";
    auth_basic_user_file /etc/nginx/.htpasswd-nijahomzs-manager;

    location / {
        proxy_pass http://evolution_manager_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
